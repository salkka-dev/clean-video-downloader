name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            key: windows-x64
            command: npx electron-builder --win nsis zip --x64 --publish never -c.win.signAndEditExecutable=true
          - runner: macos-15
            key: mac-arm64
            command: npx electron-builder --mac dmg zip --arm64 --publish never
          - runner: macos-15-intel
            key: mac-x64
            command: npx electron-builder --mac dmg zip --x64 --publish never
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:tools
      - run: ${{ matrix.command }}
      - name: Verify macOS signatures
        if: startsWith(matrix.key, 'mac-')
        shell: bash
        run: |
          app_path="$(find release -type d -name '*.app' -maxdepth 3 | head -n 1)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome extension
        run: cd extension && zip -r ../Clean-Video-Downloader-Chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: Clean-Video-Downloader-Chrome.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
