<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    @font-face{font-family:Pretendard;src:url('../../docs/fonts/Pretendard-Regular.otf')}@font-face{font-family:Pretendard;src:url('../../docs/fonts/Pretendard-Bold.otf');font-weight:700}
    *{box-sizing:border-box}html,body{width:440px;height:280px;margin:0;overflow:hidden}body{font-family:Pretendard,sans-serif;color:#f4f8ff;background:radial-gradient(circle at 86% 14%,rgba(75,126,255,.38),transparent 170px),linear-gradient(145deg,#071321,#0a1d35)}
    .wrap{position:relative;width:100%;height:100%;padding:34px 38px}.brand{display:flex;align-items:center;gap:12px;color:#90a5c3;font-size:11px;font-weight:700;letter-spacing:.12em}.icon{width:38px;height:38px}.copy{position:absolute;left:38px;bottom:38px}.copy h1{margin:0;font-size:31px;line-height:1.16;letter-spacing:-.05em}.copy p{margin:13px 0 0;color:#95a9c5;font-size:13px}.menu{position:absolute;right:24px;bottom:29px;width:173px;padding:11px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(9,18,31,.94);box-shadow:0 20px 45px rgba(0,0,0,.35);transform:translateY(4px)}.menu div{padding:10px 11px;border-radius:8px;background:#1e4fc0;color:white;font-size:10px;font-weight:700}.menu small{display:block;padding:5px 11px 1px;color:#60738f;font-size:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img class="icon" src="icon128.svg" alt="">CLEAN VIDEO</div>
    <div class="copy"><h1>우클릭 한 번으로<br>앱에 링크 전송</h1><p>복사·붙여넣기 없이 바로 다운로드 준비</p></div>
    <div class="menu"><small>영상 페이지</small><div>↓ 클린 영상 다운로더로 받기</div></div>
  </main>
</body>
</html>
