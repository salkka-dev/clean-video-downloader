<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>클린 영상 다운로더</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside id="update-banner" class="update-banner" hidden>
      <span>새 버전 <strong id="update-version"></strong>을 받을 수 있습니다.</span>
      <button id="open-update" type="button">업데이트 페이지</button>
    </aside>

    <header class="hero">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div>
        <p class="eyebrow">CLEAN VIDEO WORKFLOW</p>
        <h1>클린 영상 다운로더</h1>
        <p class="subtitle">권한 있는 영상을 최고 화질로 받고, Premiere에 바로 넣을 수 있는 MP4로 정리합니다.</p>
      </div>
      <span id="version-badge" class="version-badge"></span>
    </header>

    <section class="card link-card">
      <div class="section-title">
        <label for="urls">영상 링크</label>
        <span id="url-count">0개</span>
      </div>
      <textarea id="urls" spellcheck="false" placeholder="YouTube · Vimeo · Instagram · TikTok · TVCF 링크를 한 줄에 하나씩 붙여 넣으세요.&#10;Chrome 확장에서 보낸 링크도 여기에 자동으로 들어옵니다."></textarea>
    </section>

    <section class="workspace-grid">
      <div class="card settings-card">
        <div class="field location-field">
          <label>저장 위치</label>
          <div class="folder-row">
            <input id="folder" type="text" readonly>
            <button id="choose-folder" class="button soft" type="button">선택</button>
            <button id="open-folder" class="button soft" type="button">폴더 열기</button>
          </div>
        </div>

        <div class="select-grid">
          <div class="field">
            <label for="quality">화질</label>
            <select id="quality">
              <option value="best">최고 화질</option>
              <option value="2160">최대 4K</option>
              <option value="1080">최대 1080p</option>
              <option value="720">최대 720p</option>
              <option value="audio">오디오만 (MP3)</option>
            </select>
          </div>
          <div class="field">
            <label for="browser">다른 사이트 로그인</label>
            <select id="browser"></select>
          </div>
        </div>

        <div class="toggle-list" aria-label="추가 처리">
          <label class="toggle-row">
            <input id="premiere" type="checkbox" checked>
            <span class="switch" aria-hidden="true"></span>
            <span><strong>Premiere 호환 MP4</strong><small>H.264 · AAC · 48kHz · Fast Start</small></span>
          </label>
          <label class="toggle-row">
            <input id="subtitles" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            <span><strong>한글·영문 자막</strong><small>제공되는 경우 SRT로 함께 저장</small></span>
          </label>
          <label class="toggle-row">
            <input id="thumbnail" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            <span><strong>썸네일 저장</strong><small>제공되는 경우 JPG로 함께 저장</small></span>
          </label>
        </div>

        <div class="tvcf-panel">
          <div>
            <strong>TVCF 계정 연결</strong>
            <small>앱의 보안 로그인 창에서 계정 권한 범위의 영상을 확인합니다.</small>
          </div>
          <button id="tvcf-login" class="button tvcf" type="button"><span id="tvcf-state">로그인</span></button>
        </div>
      </div>

      <section class="console-card" aria-live="polite">
        <div class="console-head">
          <span id="status-dot" class="status-dot"></span>
          <span id="status">대기 중</span>
          <span id="arch-badge"></span>
        </div>
        <pre id="log">링크를 입력하고 다운로드 시작을 눌러 주세요.
다운로드 권한이 있거나 직접 소유한 영상만 사용하세요.</pre>
      </section>
    </section>

    <div class="action-row">
      <div class="progress-track" aria-label="진행률"><div id="progress" class="progress-bar"></div></div>
      <button id="cancel" class="button cancel" type="button" disabled>취소</button>
      <button id="start" class="button primary" type="button">다운로드 시작 <span aria-hidden="true">↓</span></button>
    </div>

    <footer>로컬 처리 · DRM 및 접근 제한 우회 없음 · Chrome 우클릭 확장 지원</footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
