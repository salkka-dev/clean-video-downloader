name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: false
        default: v2.5.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            key: windows-x64
            command: npx electron-builder --win nsis zip --x64 --publish never
          - runner: macos-15
            key: mac-arm64
            command: npx electron-builder --mac zip --arm64 --publish never
            dmg_arch: arm64
          - runner: macos-15-intel
            key: mac-x64
            command: npx electron-builder --mac zip --x64 --publish never
            dmg_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:tools
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Stage plug-in engine files (Windows)
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          Copy-Item vendor/current/yt-dlp.exe release/Clean-Video-Engine-windows-x64-yt-dlp.exe
          Copy-Item vendor/current/ffmpeg.exe release/Clean-Video-Engine-windows-x64-ffmpeg.exe
      - name: Stage plug-in engine files (macOS)
        if: startsWith(matrix.key, 'mac-')
        shell: bash
        run: |
          cp vendor/current/yt-dlp "release/Clean-Video-Engine-${{ matrix.key }}-yt-dlp"
          cp vendor/current/ffmpeg "release/Clean-Video-Engine-${{ matrix.key }}-ffmpeg"
      - name: Create macOS DMG
        if: startsWith(matrix.key, 'mac-')
        shell: bash
        run: |
          app_path="$(find release -type d -name '*.app' -print | head -n 1)"
          test -n "$app_path"
          hdiutil create -volname "클린 영상 다운로더" -srcfolder "$app_path" -ov -format UDZO "release/Clean-Video-Downloader-mac-${{ matrix.dmg_arch }}.dmg"
      - name: Verify macOS signatures
        if: startsWith(matrix.key, 'mac-')
        shell: bash
        run: |
          app_path="$(find release -type d -name '*.app' -print | head -n 1)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/Clean-Video-Engine-*
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package Chrome extension
        run: npm run package:extension
      - name: Package Premiere all-in-one panel
        run: npm run package:cep
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-integrations
          path: |
            release/Clean-Video-Downloader-Chrome*.zip
            release/Clean-Video-Studio-Premiere*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: artifacts/*
